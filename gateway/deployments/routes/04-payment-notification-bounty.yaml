# =============================================================================
# Payment, notification, bounty
# =============================================================================
# CRITICAL: notification + bounty have /v1/me/* paths that must match BEFORE
# the user-svc /v1/me catch-all. Istio evaluates VirtualServices in the order
# they appear AND within a VirtualService, route entries are evaluated top-to-
# bottom. Because route entries are scoped per-VirtualService, we leverage the
# fact that the gateway will evaluate each VS's first route entry — most
# specific must come first within each.
#
# Practical safeguard: every /v1/me/{thing} route uses an exact path prefix
# that doesn't collide. Verified by scripts/validate.sh.
# =============================================================================
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: payment-routes
  namespace: gateway-system
spec:
  hosts: [api.offensiveconditions.org]
  gateways: [gateway-system/offcon-api-gateway]
  http:
    # Stripe webhooks — NEVER apply user JWT; webhook signature is validated
    # by the service. Tight rate limit, no retries.
    - name: payment-webhook
      match:
        - uri: { prefix: /v1/webhooks/payment }
      route:
        - destination:
            host: payment-svc.offcon.svc.cluster.local
            port: { number: 8007 }
      timeout: 15s
      retries: { attempts: 0 }
      headers:
        request:
          set:
            x-gateway-route: "payment-webhook"

    - name: billing
      match:
        - uri: { prefix: /v1/billing }
      route:
        - destination:
            host: payment-svc.offcon.svc.cluster.local
            port: { number: 8007 }
      timeout: 15s
      retries:
        attempts: 1
        perTryTimeout: 8s
        retryOn: connect-failure,refused-stream

    - name: payments
      match:
        - uri: { prefix: /v1/payments }
      route:
        - destination:
            host: payment-svc.offcon.svc.cluster.local
            port: { number: 8007 }
      timeout: 15s
      retries:
        attempts: 1
        perTryTimeout: 8s
        retryOn: connect-failure,refused-stream

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: notification-routes
  namespace: gateway-system
spec:
  hosts: [api.offensiveconditions.org]
  gateways: [gateway-system/offcon-api-gateway]
  http:
    # WebSocket — most specific first
    - name: notification-ws
      match:
        - uri: { prefix: /v1/ws/notifications }
      route:
        - destination:
            host: notification-svc.offcon.svc.cluster.local
            port: { number: 8008 }
      timeout: 0s
      retries: { attempts: 0 }

    - name: me-notifications
      match:
        - uri: { prefix: /v1/me/notifications }
      route:
        - destination:
            host: notification-svc.offcon.svc.cluster.local
            port: { number: 8008 }
      timeout: 10s
      retries: { attempts: 2, perTryTimeout: 5s, retryOn: 5xx,connect-failure }

    - name: me-webhooks
      match:
        - uri: { prefix: /v1/me/webhooks }
      route:
        - destination:
            host: notification-svc.offcon.svc.cluster.local
            port: { number: 8008 }
      timeout: 10s
      retries: { attempts: 1, perTryTimeout: 5s }

    - name: me-preferences
      match:
        - uri: { prefix: /v1/me/preferences }
      route:
        - destination:
            host: notification-svc.offcon.svc.cluster.local
            port: { number: 8008 }
      timeout: 10s
      retries: { attempts: 1, perTryTimeout: 5s }

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: bounty-routes
  namespace: gateway-system
spec:
  hosts: [api.offensiveconditions.org]
  gateways: [gateway-system/offcon-api-gateway]
  http:
    - name: programs
      match:
        - uri: { prefix: /v1/programs }
      route:
        - destination:
            host: bounty-svc.offcon.svc.cluster.local
            port: { number: 8009 }
      timeout: 10s
      retries: { attempts: 2, perTryTimeout: 5s, retryOn: 5xx,connect-failure }

    - name: me-reports
      match:
        - uri: { prefix: /v1/me/reports }
      route:
        - destination:
            host: bounty-svc.offcon.svc.cluster.local
            port: { number: 8009 }
      timeout: 10s
      retries: { attempts: 1, perTryTimeout: 5s }

    - name: me-payouts
      match:
        - uri: { prefix: /v1/me/payouts }
      route:
        - destination:
            host: bounty-svc.offcon.svc.cluster.local
            port: { number: 8009 }
      timeout: 10s
      retries: { attempts: 1, perTryTimeout: 5s }

    - name: reports
      match:
        - uri: { prefix: /v1/reports }
      route:
        - destination:
            host: bounty-svc.offcon.svc.cluster.local
            port: { number: 8009 }
      timeout: 10s
      retries: { attempts: 1, perTryTimeout: 5s }

    - name: attachments
      match:
        - uri: { prefix: /v1/attachments }
      route:
        - destination:
            host: bounty-svc.offcon.svc.cluster.local
            port: { number: 8009 }
      timeout: 10s
      retries: { attempts: 2, perTryTimeout: 5s }
