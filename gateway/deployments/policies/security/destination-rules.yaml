# =============================================================================
# DestinationRules — connection pools, outlier detection (circuit breaking),
# and load-balancing policy per service.
# =============================================================================
# These apply to traffic AFTER routing — they govern how the sidecar talks to
# each upstream. mTLS is ISTIO_MUTUAL (the mesh default).
# =============================================================================
---
# A sane default for all offcon services
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: offcon-default
  namespace: offcon
spec:
  host: "*.offcon.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 256
        connectTimeout: 3s
        tcpKeepalive:
          time: 60s
          interval: 30s
          probes: 3
      http:
        http1MaxPendingRequests: 256
        http2MaxRequests: 1000
        maxRequestsPerConnection: 0     # unlimited reuse
        maxRetries: 3
        idleTimeout: 60s
        h2UpgradePolicy: UPGRADE
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
    loadBalancer:
      simple: LEAST_REQUEST

---
# orchestrator — long-lived spawn calls, smaller pool, no aggressive ejection
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: orchestrator-dr
  namespace: offcon
spec:
  host: orchestrator.offcon.svc.cluster.local
  trafficPolicy:
    tls: { mode: ISTIO_MUTUAL }
    connectionPool:
      tcp:
        maxConnections: 64
        connectTimeout: 5s
      http:
        http1MaxPendingRequests: 64
        maxRequestsPerConnection: 1     # spawn ops shouldn't share connections
        idleTimeout: 120s
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 15s
      baseEjectionTime: 60s
      maxEjectionPercent: 30

---
# payment-svc — never eject aggressively (money path), strict timeouts
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: payment-svc-dr
  namespace: offcon
spec:
  host: payment-svc.offcon.svc.cluster.local
  trafficPolicy:
    tls: { mode: ISTIO_MUTUAL }
    connectionPool:
      tcp:
        maxConnections: 128
        connectTimeout: 3s
      http:
        http1MaxPendingRequests: 128
        http2MaxRequests: 256
        idleTimeout: 60s
    outlierDetection:
      consecutive5xxErrors: 10           # tolerant — don't eject the money service early
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 25
    loadBalancer:
      simple: ROUND_ROBIN

---
# auth-svc — hot path, large pool, fast ejection
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: auth-dr
  namespace: offcon
spec:
  host: auth.offcon.svc.cluster.local
  trafficPolicy:
    tls: { mode: ISTIO_MUTUAL }
    connectionPool:
      tcp:
        maxConnections: 512
        connectTimeout: 2s
      http:
        http1MaxPendingRequests: 512
        http2MaxRequests: 2000
        idleTimeout: 30s
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 5s
      baseEjectionTime: 15s
      maxEjectionPercent: 50
    loadBalancer:
      simple: LEAST_REQUEST
