---
# notification-svc: gateway + every service that emits user notifications
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: notification-svc-callers
  namespace: offcon
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-svc
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/gateway-system/sa/istio-ingressgateway-service-account
              - cluster.local/ns/offcon/sa/auth
              - cluster.local/ns/offcon/sa/scoring
              - cluster.local/ns/offcon/sa/payment-svc
              - cluster.local/ns/offcon/sa/forum-svc
              - cluster.local/ns/offcon/sa/writeup-svc
              - cluster.local/ns/offcon/sa/ctf-svc
              - cluster.local/ns/offcon/sa/bounty-svc

---
# bounty-svc: gateway + payment-svc (payout settlement callback via gRPC)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: bounty-svc-callers
  namespace: offcon
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bounty-svc
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/gateway-system/sa/istio-ingressgateway-service-account
              - cluster.local/ns/offcon/sa/payment-svc
              - cluster.local/ns/offcon/sa/content-svc

---
# content-svc, ctf-svc, forum-svc, writeup-svc: primarily gateway-fronted, plus
# cross-references. Grouped allow for the simpler ones.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: content-svc-callers
  namespace: offcon
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: content-svc
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/gateway-system/sa/istio-ingressgateway-service-account
              - cluster.local/ns/offcon/sa/orchestrator
              - cluster.local/ns/offcon/sa/scoring
              - cluster.local/ns/offcon/sa/bounty-svc

