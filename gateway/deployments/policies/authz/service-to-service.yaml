              - cluster.local/ns/offcon/sa/ctf-svc
              - cluster.local/ns/offcon/sa/orchestrator

---
# orchestrator: gateway + content-svc (resolves machine specs)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: orchestrator-callers
  namespace: offcon
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: orchestrator
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/gateway-system/sa/istio-ingressgateway-service-account
              - cluster.local/ns/offcon/sa/content-svc
              - cluster.local/ns/offcon/sa/ctf-svc

---
# payment-svc: gateway + bounty-svc (payout requests)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: payment-svc-callers
  namespace: offcon
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-svc
  action: ALLOW
  rules:
