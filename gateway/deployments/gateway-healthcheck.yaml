# =============================================================================
# Gateway healthcheck aggregator — deployment
# =============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-healthcheck
  namespace: gateway-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-healthcheck
  namespace: gateway-system
  labels:
    app.kubernetes.io/name: gateway-healthcheck
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-healthcheck
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-healthcheck
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: gateway-healthcheck
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: healthcheck
          image: harbor.offensiveconditions.org/gateway/healthcheck:v0.1.0
          env:
            - { name: HC_LISTEN_ADDR, value: ":8080" }
            - { name: HC_PROBE_TIMEOUT, value: "3s" }
            - { name: HC_CACHE_TTL, value: "5s" }
            - { name: HC_REQUIRE_ALL_UP, value: "false" }
            - { name: HC_PARALLEL_PROBES, value: "8" }
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 3
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      terminationGracePeriodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-healthcheck
  namespace: gateway-system
  labels:
    app.kubernetes.io/name: gateway-healthcheck
spec:
  selector:
    app.kubernetes.io/name: gateway-healthcheck
  ports:
    - { name: http, port: 8080, targetPort: http }

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-healthcheck
  namespace: gateway-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-healthcheck
