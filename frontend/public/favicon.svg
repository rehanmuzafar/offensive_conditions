<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.15 -1.3 2.3 2.1" width="512" height="512">
  <title>OFFCON</title>
  <!--
    The favicon is the skull alone: no disc, no ground, nothing behind it.

    A browser tab is about sixteen pixels of real estate sitting on whatever
    colour the user's theme happens to be, so a filled background would show as
    a coloured square in a light tab and a different one in a dark tab. The
    silhouette with the sockets cut through reads as the mark either way.

    The contour is the same one the 3D skull is extruded from — taken from
    SkullGlyph rather than traced again, so the tab icon and the object on the
    page cannot drift apart.

    evenodd is what makes the eyes and nose holes instead of shapes painted on
    top; without it they fill solid and the skull loses its face at small sizes.
  -->
