# ============================================================================
#  OFFCON edge — local API gateway stand-in. Routes /v1/<area> to the owning
#  service. (Production uses the Istio gateway from Phase 14; this nginx is a
#  lightweight local equivalent so the frontend has one origin on :8080.)
# ============================================================================
worker_processes auto;
events { worker_connections 1024; }

http {
  resolver 127.0.0.11 valid=10s;   # docker DNS
  default_type application/json;
  sendfile on;
  keepalive_timeout 65;

  # Upstream service addresses (container-name:http-port from compose)
  # Using variables so nginx starts even if a service is briefly down.
  map $uri $offcon_unused { default 0; }

  # WebSocket handshakes need Upgrade/Connection forwarded. Without the map,
  # sending "Connection: upgrade" on every request breaks keep-alive for
  # ordinary HTML/JSON responses.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ---------------------------------------------------------------------------
  # Port 80 is here for two reasons, neither of which is serving the site.
  #
  # Let's Encrypt's HTTP-01 challenge is pinned to port 80 by the ACME spec and
  # cannot be moved to another port, so that one path has to be reachable in
  # the clear. It is served from a directory certbot writes into.
  #
  # Everything else is redirected to HTTPS, because a visitor who types the
  # bare domain arrives here first. Without this they get a connection error
  # instead of the site — a browser tries http before it tries anything else.
  # ---------------------------------------------------------------------------
  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type "text/plain";
    }

    # $host carries no port, so this lands on 443 — where the router sends
    # outside traffic, whatever port the edge itself happens to listen on.
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---------------------------------------------------------------------------
  # TLS on 443, for local development as much as for production.
  #
  # The surfaces have to live on a real domain — `localhost` cannot carry a
  # cookie shared across subdomains — and browsers treat a real domain as one:
  # Firefox upgrades http://dashboard.lvh.me to https and gets a plain HTTP
  # server back, which it reports as SSL_ERROR_RX_RECORD_TOO_LONG.
  #
  # Serving real TLS locally settles that and removes the last differences from
  # production: Secure cookies behave the same, and there is no port in any URL.
  # The certificate is issued by the developer's own mkcert CA, which is already
  # in the system and Firefox trust stores.
  # ---------------------------------------------------------------------------
  server {
    listen 443 ssl;
    http2 on;
    server_name offensiveconditions.org *.offensiveconditions.org lvh.me *.lvh.me localhost;

    ssl_certificate     /secrets/tls/live-offensiveconditions.org.pem;
    ssl_certificate_key /secrets/tls/live-offensiveconditions.org-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Uploaded media (event banners, avatars) lives in MinIO. The bucket is
    # public-read, so this is a plain proxy — but MinIO itself must never be
    # exposed directly: it only listens on 127.0.0.1 and its console and
    # write API stay off the internet entirely.
    location /media/ {
      set $minio_up "minio:9000";
      rewrite ^/media/(.*)$ /$1 break;
      proxy_pass http://$minio_up;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # Only reads. A GET/HEAD-only surface cannot be used to plant objects.
      limit_except GET HEAD { deny all; }
      proxy_hide_header x-amz-request-id;
      proxy_hide_header x-amz-id-2;
      add_header Cache-Control "public, max-age=86400" always;
    }

    # Everything not an API path is the Next application. It handles its own
    # host-based routing, so the Host header has to survive the hop.
    location / {
      set $app "frontend:3000";
      proxy_pass http://$app;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    include /etc/nginx/conf.d/api-routes.conf;
  }

  # ---------------------------------------------------------------------------
  # Spawned CTF challenges
  # ---------------------------------------------------------------------------
  # Each running challenge is published on a host port and reached as
  # lab-<port>.<domain>. Routing them through 443 means the raw ports never have
  # to be forwarded on the router — which matters here, because this ONT only
  # accepts single-port mappings, not ranges — and players get a real
  # certificate instead of a browser warning.
  #
  # The names are listed out rather than matched by regex, and that is not
  # stylistic: nginx resolves server_name by exact name first, then wildcards,
  # and only then regular expressions. The main block below claims
  # *.offensiveconditions.org, so a regex here never gets a look in — every lab
  # request was being answered by the Next application instead.
  #
  # The map doubles as the allowlist. A name that is not in it yields an empty
  # $labport and is refused, so this block can never be talked into proxying to
  # an arbitrary port on the host — lab-5432.<domain> would otherwise have
  # reached Postgres. Keep the three in step: this map, DOCKER_PORT_RANGE, and
  # the lab-* names on the certificate.
  map $host $labport {
    default "";
    lab-40000.offensiveconditions.org  40000;
    lab-40001.offensiveconditions.org  40001;
    lab-40002.offensiveconditions.org  40002;
    lab-40003.offensiveconditions.org  40003;
    lab-40004.offensiveconditions.org  40004;
    lab-40005.offensiveconditions.org  40005;
    lab-40006.offensiveconditions.org  40006;
    lab-40007.offensiveconditions.org  40007;
    lab-40008.offensiveconditions.org  40008;
    lab-40009.offensiveconditions.org  40009;
    lab-40010.offensiveconditions.org  40010;
    lab-40011.offensiveconditions.org  40011;
    lab-40012.offensiveconditions.org  40012;
    lab-40013.offensiveconditions.org  40013;
    lab-40014.offensiveconditions.org  40014;
    lab-40015.offensiveconditions.org  40015;
    lab-40016.offensiveconditions.org  40016;
    lab-40017.offensiveconditions.org  40017;
    lab-40018.offensiveconditions.org  40018;
    lab-40019.offensiveconditions.org  40019;
    lab-40020.offensiveconditions.org  40020;
    lab-40021.offensiveconditions.org  40021;
    lab-40022.offensiveconditions.org  40022;
    lab-40023.offensiveconditions.org  40023;
    lab-40024.offensiveconditions.org  40024;
    lab-40025.offensiveconditions.org  40025;
    lab-40026.offensiveconditions.org  40026;
    lab-40027.offensiveconditions.org  40027;
    lab-40028.offensiveconditions.org  40028;
    lab-40029.offensiveconditions.org  40029;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name
      lab-40000.offensiveconditions.org
      lab-40001.offensiveconditions.org
      lab-40002.offensiveconditions.org
      lab-40003.offensiveconditions.org
      lab-40004.offensiveconditions.org
      lab-40005.offensiveconditions.org
      lab-40006.offensiveconditions.org
      lab-40007.offensiveconditions.org
      lab-40008.offensiveconditions.org
      lab-40009.offensiveconditions.org
      lab-40010.offensiveconditions.org
      lab-40011.offensiveconditions.org
      lab-40012.offensiveconditions.org
      lab-40013.offensiveconditions.org
      lab-40014.offensiveconditions.org
      lab-40015.offensiveconditions.org
      lab-40016.offensiveconditions.org
      lab-40017.offensiveconditions.org
      lab-40018.offensiveconditions.org
      lab-40019.offensiveconditions.org
      lab-40020.offensiveconditions.org
      lab-40021.offensiveconditions.org
      lab-40022.offensiveconditions.org
      lab-40023.offensiveconditions.org
      lab-40024.offensiveconditions.org
      lab-40025.offensiveconditions.org
      lab-40026.offensiveconditions.org
      lab-40027.offensiveconditions.org
      lab-40028.offensiveconditions.org
      lab-40029.offensiveconditions.org;

    ssl_certificate     /secrets/tls/live-offensiveconditions.org.pem;
    ssl_certificate_key /secrets/tls/live-offensiveconditions.org-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # A challenge is someone else's code being attacked on purpose. Keep the
    # platform's cookies away from it and let it say what it likes about itself.
    proxy_hide_header Set-Cookie;
    proxy_set_header Cookie "";

    location / {
      if ($labport = "") { return 404; }
      # The container publishes on the host, which the edge reaches through the
      # docker gateway. Services bound to 127.0.0.1 — Postgres, Redis and the
      # rest — are not reachable this way even if the map were wrong.
      #
      # A literal address on purpose: with a variable in proxy_pass nginx goes to
      # its resolver and never consults /etc/hosts, so host.docker.internal would
      # not resolve here.
      set $lab_up "172.18.0.1:$labport";
      proxy_pass http://$lab_up;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # A challenge that hangs must not hold an edge worker forever.
      proxy_connect_timeout 5s;
      proxy_read_timeout 120s;
      proxy_buffering off;
    }
  }

  # Plain HTTP stays on 8080 for anything talking to the API directly — curl,
  # the service-to-service calls, and the health checks.
  server {
    listen 8080;
    server_name _;

    # CORS is deliberately NOT handled here.
    #
    # This block used to echo $http_origin back with Allow-Credentials: true,
    # which is the permissive combination — any site a signed-in user visited
    # could make credentialed cross-origin calls and read the answers. It also
    # produced two Access-Control-Allow-Origin headers on every response,
    # because the services set their own; browsers reject a response carrying
    # more than one.
    #
    # Every service behind this proxy applies its own allowlist from
    # HTTP_CORS_ORIGINS — FastAPI's CORSMiddleware, gin-contrib/cors and
    # @fastify/cors — so each one is the single authority for its own routes,
    # and the allowlist has exactly one definition.
    #
    # The OPTIONS short-circuit went with it: preflights now reach the service
    # that will answer the real request, which is the only place that knows
    # whether the origin, method and headers are actually allowed.

    include /etc/nginx/conf.d/api-routes.conf;
  }
}
