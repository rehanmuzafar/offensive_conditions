# ============================================================================
#  OFFCON edge — local API gateway stand-in. Routes /v1/<area> to the owning
#  service. (Production uses the Istio gateway from Phase 14; this nginx is a
#  lightweight local equivalent so the frontend has one origin on :8080.)
# ============================================================================
worker_processes auto;
events { worker_connections 1024; }

http {
  resolver 127.0.0.11 valid=10s;   # docker DNS
  default_type application/json;
  sendfile on;
  keepalive_timeout 65;

  # Upstream service addresses (container-name:http-port from compose)
  # Using variables so nginx starts even if a service is briefly down.
  map $uri $offcon_unused { default 0; }

  # WebSocket handshakes need Upgrade/Connection forwarded. Without the map,
  # sending "Connection: upgrade" on every request breaks keep-alive for
  # ordinary HTML/JSON responses.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;
    server_name _;

    # CORS for local dev (frontend on :3000 hitting :8080 directly if needed)
    add_header Access-Control-Allow-Origin  "$http_origin" always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization,Content-Type" always;
    add_header Access-Control-Allow-Credentials "true" always;

    if ($request_method = OPTIONS) { return 204; }

    # ---- auth ----
    location /v1/auth      { set $u "auth:8001";          proxy_pass http://$u; }

    # ---- notification-svc owns /v1/me/notifications, so it must be matched
    #      before the more general /v1/me rule below (longest prefix wins) ----
    location /v1/me/notifications { set $u "notification-svc:8008"; proxy_pass http://$u; }

    # ---- user-svc: profile, me, sessions, api-keys, preferences ----
    # The service exposes /v1/users/me..., not /v1/me..., so rewrite the prefix.
    # proxy_pass with a variable never rewrites the URI itself — hence `rewrite`.
    location /v1/me {
      set $u "user-svc:8012";
      rewrite ^/v1/me(.*)$ /v1/users/me$1 break;
      proxy_pass http://$u;
    }
    location /v1/users     { set $u "user-svc:8012";      proxy_pass http://$u; }
    # user-svc has owned the full team API all along (create/invite/members/
    # kick/promote) but it was never routed, so nothing could reach it.
    location /v1/teams     { set $u "user-svc:8012";      proxy_pass http://$u; }
    location /v1/friends   { set $u "user-svc:8012";      proxy_pass http://$u; }
    location /v1/vpn       { set $u "user-svc:8012";      proxy_pass http://$u; }

    # ---- orchestrator: lab instances (spawn/stop/extend/reset) ----
    location /v1/instances { set $u "orchestrator:8002";  proxy_pass http://$u; }

    # ---- scoring: leaderboard(s) + seasons + badges + profile ----
    location /v1/leaderboard { set $u "scoring:8003";     proxy_pass http://$u; }
    location /v1/seasons     { set $u "scoring:8003";     proxy_pass http://$u; }
    location /v1/badges      { set $u "scoring:8003";     proxy_pass http://$u; }
    location /v1/profile     { set $u "scoring:8003";     proxy_pass http://$u; }

    # ---- flag-verifier ----
    location /v1/flag      { set $u "flag-verifier:8005"; proxy_pass http://$u; }

    # ---- ctf-svc ----
    location /v1/ctf/ {
      set $u "ctf-svc:8004";
      rewrite ^/v1/ctf/(.*)$ /v1/$1 break;
      proxy_pass http://$u;
    }

    # ---- forum-svc ----
    location /v1/forum/ {
      set $u "forum-svc:8006";
      rewrite ^/v1/forum/(.*)$ /v1/$1 break;
      proxy_pass http://$u;
    }

    # ---- writeup-svc ----
    location /v1/writeups  { set $u "writeup-svc:8011";   proxy_pass http://$u; }

    # ---- content-svc: catalog (machines, challenges, learning paths, tags) ----
    location /v1/machines   { set $u "content-svc:8010";  proxy_pass http://$u; }
    location /v1/challenges { set $u "content-svc:8010";  proxy_pass http://$u; }
    location /v1/paths      { set $u "content-svc:8010";  proxy_pass http://$u; }
    location /v1/tags       { set $u "content-svc:8010";  proxy_pass http://$u; }
    location /v1/search     { set $u "content-svc:8010";  proxy_pass http://$u; }
    location /v1/content    { set $u "content-svc:8010";  proxy_pass http://$u; }
    # banner/cover uploads — multipart, so raise the body limit above the 1m default
    location /v1/media {
      set $u "content-svc:8010";
      client_max_body_size 8m;
      proxy_request_buffering off;
      proxy_pass http://$u;
    }

    # ---- bounty-svc: programs + reports ----
    location /v1/programs  { set $u "bounty-svc:8009";    proxy_pass http://$u; }
    location /v1/reports   { set $u "bounty-svc:8009";    proxy_pass http://$u; }

    # ---- payment-svc: billing ----
    location /v1/billing/ {
      set $u "payment-svc:8007";
      rewrite ^/v1/billing/(.*)$ /v1/$1 break;
      proxy_pass http://$u;
    }

    # ---- notification-svc ----
    location /v1/notifications { set $u "notification-svc:8008"; proxy_pass http://$u; }

    # ---- admin: fan-out lives in each service ----
    # scoring owns anti-cheat review and season rollover; everything else
    # (capacity, force-kill) is the orchestrator's. Longest prefix wins, so the
    # scoring routes must be listed before the catch-all.
    location /v1/admin/anti-cheat-flags { set $u "scoring:8003"; proxy_pass http://$u; }
    location /v1/admin/seasons          { set $u "scoring:8003"; proxy_pass http://$u; }
    location /v1/admin     { set $u "orchestrator:8002";  proxy_pass http://$u; }

    # Health
    location = /healthz { return 200 '{"status":"ok","edge":"nginx"}'; }

    # Common proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # A live feed must not be cut off by the default 60s read timeout.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
