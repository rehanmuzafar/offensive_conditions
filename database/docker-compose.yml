version: '3.9'

# =============================================================================
# Offensive Conditions — Local Development Database Stack
# =============================================================================
# Provides PostgreSQL, Redis, MinIO for local development.
# Production deployments use managed services (RDS, ElastiCache) or
# dedicated clusters (CloudNativePG operator, Redis operator).
# =============================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: offcon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: offcon_admin
      POSTGRES_PASSWORD: dev_only_change_in_prod
      POSTGRES_DB: offcon
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "log_statement=ddl"
      - "-c"
      - "log_min_duration_statement=500"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offcon_admin -d offcon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: offcon-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: offcon-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: offcon_dev
      MINIO_ROOT_PASSWORD: dev_only_change_in_prod
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer for local DB inspection (UI)
  adminer:
    image: adminer:latest
    container_name: offcon-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark

  # Migration runner (run on demand)
  migrate:
    image: migrate/migrate:latest
    container_name: offcon-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    profiles: ["tools"]   # Only starts when explicitly invoked
    # Usage:
    #   docker compose run --rm migrate -path /migrations/auth -database \
    #     "postgres://migrator:CHANGE_ME@postgres:5432/offcon?sslmode=disable" up

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  default:
    name: offcon_dev
