# ============================================================================
#  Grafana datasources — auto-provisioned. The key feature here is CORRELATION:
#  Tempo traces link to Loki logs and Prometheus metrics, and Loki logs link
#  back to Tempo traces via the trace_id. One click moves between the three.
# ============================================================================
apiVersion: 1

datasources:
  # --------------------------------------------------------------------------
  # Prometheus — metrics (default)
  # --------------------------------------------------------------------------
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      cacheLevel: High
      exemplarTraceIdDestinations:
        # Exemplars on latency histograms jump straight to the trace
        - name: trace_id
          datasourceUid: tempo

  # --------------------------------------------------------------------------
  # Loki — logs
  # --------------------------------------------------------------------------
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # Clicking a trace_id in a log line opens the trace in Tempo
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"(\w+)"'
          url: "$${__value.raw}"
          datasourceUid: tempo
        - name: TraceID-logfmt
          matcherRegex: 'trace_id=(\w+)'
          url: "$${__value.raw}"
          datasourceUid: tempo

  # --------------------------------------------------------------------------
  # Tempo — traces (with full correlation back to logs + metrics)
  # --------------------------------------------------------------------------
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Trace → Logs: find logs for this trace in Loki
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        tags:
          - key: service.name
            value: service
        filterByTraceID: true
        filterBySpanID: false
      # Trace → Metrics: see RED metrics for the span's service
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        tags:
          - key: service.name
            value: service
        queries:
          - name: "Request rate"
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))'
          - name: "p95 latency"
            query: 'histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])) by (le))'
      # Service graph built from trace metrics
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: loki
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
