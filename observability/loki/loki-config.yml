# ============================================================================
#  Loki — log aggregation. Stores logs in object storage (S3-compatible),
#  indexed by labels. Tuned for a multi-tenant-off, single-binary-scalable
#  deployment with a 30-day retention.
# ============================================================================
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info
  grpc_server_max_recv_msg_size: 8388608
  grpc_server_max_send_msg_size: 8388608

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    s3:
      endpoint: "${S3_ENDPOINT}"
      bucketnames: offcon-loki
      access_key_id: "${S3_ACCESS_KEY}"
      secret_access_key: "${S3_SECRET_KEY}"
      s3forcepathstyle: true
      insecure: false
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Schema — TSDB index, the modern Loki default
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: offcon_index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
    cache_ttl: 24h
  aws:
    endpoint: "${S3_ENDPOINT}"
    bucketnames: offcon-loki
    s3forcepathstyle: true

# Limits — protect Loki from runaway ingestion
limits_config:
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_label_name_length: 1024
  max_label_value_length: 4096
  max_label_names_per_series: 30
  reject_old_samples: true
  reject_old_samples_max_age: 168h # 7d
  max_query_length: 721h # 30d + buffer
  max_query_parallelism: 32
  max_streams_per_user: 10000
  max_line_size: 256kb
  retention_period: 720h # 30 days
  split_queries_by_interval: 15m
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 20MB

# Query result + index caching
query_range:
  align_queries_with_step: true
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 256

# Compaction + retention enforcement
compactor:
  working_directory: /loki/compactor
  delete_request_store: s3
  retention_enabled: true
  retention_delete_delay: 2h
  compaction_interval: 10m

# Ingester WAL — durability for in-flight logs
ingester:
  wal:
    enabled: true
    dir: /loki/wal
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  chunk_idle_period: 1h
  chunk_target_size: 1572864
  max_chunk_age: 2h

# Ruler — Loki can alert on log patterns too (sends to AlertManager)
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true
