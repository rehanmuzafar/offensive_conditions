# ============================================================================
#  Loki ruler — alerts derived from LOG patterns (complements metric alerts).
#  Useful for things metrics can't see: stack traces, specific error strings,
#  security events.
# ============================================================================
groups:
  - name: offcon-log-alerts
    rules:
      - alert: PanicDetected
        expr: |
          sum by (service) (count_over_time({namespace="offcon"} |~ "(?i)panic:" [5m])) > 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Panic detected in {{ $labels.service }}"
          description: "A panic/stack-trace appeared in {{ $labels.service }} logs in the last 5 minutes."

      - alert: HighLogErrorVolume
        expr: |
          sum by (service) (rate({namespace="offcon"} |= "level=error" [5m])) > 10
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High error-log volume in {{ $labels.service }}"
          description: "{{ $labels.service }} is logging more than 10 errors/sec."

      - alert: AuthBruteForceSuspected
        expr: |
          sum by (service) (count_over_time({service="auth-svc"} |~ "(?i)invalid credentials|login failed" [5m])) > 100
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "Possible brute-force on auth-svc"
          description: "More than 100 failed logins in 5 minutes — possible credential-stuffing attack."

      - alert: DatabaseConnectionErrors
        expr: |
          sum by (service) (count_over_time({namespace="offcon"} |~ "(?i)connection refused|too many connections|dial tcp.*5432" [5m])) > 5
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Database connection errors in {{ $labels.service }}"
          description: "{{ $labels.service }} is logging database connection failures."

      - alert: OOMKillDetected
        expr: |
          sum by (service) (count_over_time({namespace="offcon"} |~ "(?i)out of memory|oomkilled|fatal error: runtime: out of memory" [10m])) > 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "OOM kill detected in {{ $labels.service }}"
          description: "An out-of-memory condition was logged for {{ $labels.service }}."
