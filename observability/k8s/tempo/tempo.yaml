# ============================================================================
#  Tempo — distributed tracing backend with metrics-generator remote-writing
#  RED metrics + service graphs into Prometheus.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: observability
  labels: { app: tempo }
spec:
  selector: { app: tempo }
  ports:
    - { name: http, port: 3200, targetPort: 3200 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: jaeger-grpc, port: 14250, targetPort: 14250 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tempo
  namespace: observability
spec:
  serviceName: tempo
  replicas: 1
  selector:
    matchLabels: { app: tempo }
  template:
    metadata:
      labels: { app: tempo, tier: observability }
    spec:
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsNonRoot: true
      containers:
        - name: tempo
          image: grafana/tempo:2.6.1
          args: ["-config.file=/etc/tempo/tempo-config.yml", "-config.expand-env=true"]
          ports:
            - { name: http, containerPort: 3200 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          envFrom:
            - secretRef: { name: tempo-s3-secrets }
          resources:
            requests: { cpu: "300m", memory: "1Gi" }
            limits: { cpu: "1500m", memory: "3Gi" }
          readinessProbe:
            httpGet: { path: /ready, port: 3200 }
            initialDelaySeconds: 30
          volumeMounts:
            - { name: config, mountPath: /etc/tempo }
            - { name: data, mountPath: /var/tempo }
      volumes:
        - name: config
          configMap: { name: tempo-config }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 20Gi }
