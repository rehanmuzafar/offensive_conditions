# ============================================================================
#  AlertManager — routes alerts to Slack / PagerDuty. Secrets injected via env.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: observability
  labels: { app: alertmanager }
spec:
  selector: { app: alertmanager }
  ports:
    - { name: http, port: 9093, targetPort: 9093 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: alertmanager }
  template:
    metadata:
      labels: { app: alertmanager, tier: observability }
    spec:
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsNonRoot: true
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - { name: http, containerPort: 9093 }
          envFrom:
            - secretRef: { name: alertmanager-secrets }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager }
            - { name: templates, mountPath: /etc/alertmanager/templates }
            - { name: data, mountPath: /alertmanager }
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
        - name: templates
          configMap: { name: alertmanager-templates }
        - name: data
          emptyDir: {}
