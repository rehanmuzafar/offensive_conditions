# ============================================================================
#  Umbrella values — production defaults for every OFFCON service. Each top-
#  level key matches a dependency alias in Chart.yaml and is passed straight to
#  that service's offcon-service sub-chart.
#
#  CI overrides image tags via --set <svc>.image.tag=<sha>. Env-specific files
#  (helm/values/{staging,production}.yaml) override anything here.
# ============================================================================

# ---- Go core services ----
auth-svc:
  name: auth-svc
  tier: core
  language: go
  image: { repository: ghcr.io/offcon/auth-svc }
  ports: { http: 8001, grpc: 9001 }
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 15 }
  resources:
    requests: { cpu: 200m, memory: 192Mi }
    limits: { cpu: "2", memory: 512Mi }
  envFrom:
    - secretRef: { name: auth-svc-secrets }
    - configMapRef: { name: offcon-common-config }

orchestrator:
  name: orchestrator
  tier: core
  language: go
  image: { repository: ghcr.io/offcon/orchestrator }
  ports: { http: 8000, grpc: 9000 }
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 20 }
  resources:
    requests: { cpu: 300m, memory: 256Mi }
    limits: { cpu: "2", memory: 768Mi }
  envFrom:
    - secretRef: { name: orchestrator-secrets }
    - configMapRef: { name: offcon-common-config }

