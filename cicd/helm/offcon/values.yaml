# ---- Frontend (Next.js) ----
frontend:
  name: frontend
  tier: core
  language: node
  image: { repository: ghcr.io/offcon/frontend }
  ports: { http: 3000 }
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 20 }
  probes:
    readiness: { path: /api/health, initialDelaySeconds: 10, periodSeconds: 10 }
    liveness: { path: /api/health, initialDelaySeconds: 20, periodSeconds: 15 }
    startup: { path: /api/health, failureThreshold: 30, periodSeconds: 5 }
  resources:
    requests: { cpu: 150m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  # Next.js writes a cache; allow it via the default /tmp mount + .next dir
  extraVolumeMounts:
    - { name: tmp, mountPath: /tmp }
    - { name: cache, mountPath: /app/.next/cache }
  extraVolumes:
    - { name: tmp, emptyDir: {} }
    - { name: cache, emptyDir: {} }
  env:
    NEXT_PUBLIC_API_BASE_URL: "https://api.offensiveconditions.org"
  metrics: { enabled: false }
