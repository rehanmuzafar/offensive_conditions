# Production overrides — full scale, production URLs, stricter PDBs.
global:
  deployEnv: production

# Production keeps the generous autoscaling defaults from the umbrella
# values.yaml. Tighten disruption budgets for the busiest services.
orchestrator:
  pdb: { enabled: true, minAvailable: 2 }
  autoscaling: { minReplicas: 4, maxReplicas: 25 }
auth-svc:
  pdb: { enabled: true, minAvailable: 2 }
  autoscaling: { minReplicas: 4, maxReplicas: 20 }
frontend:
  pdb: { enabled: true, minAvailable: 2 }
  autoscaling: { minReplicas: 4, maxReplicas: 25 }
  env:
    NEXT_PUBLIC_API_BASE_URL: "https://api.offensiveconditions.org"
