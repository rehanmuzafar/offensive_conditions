# ============================================================================
#  ArgoCD Application — the API gateway + Istio mesh config (Phase 14).
#  Synced with retry; istio CRDs must already be installed on the cluster.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: offcon-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: offcon
  source:
    repoURL: https://github.com/offcon/offcon.git
    targetRevision: main
    path: gateway/deployments
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 10m
  # Istio config can briefly report OutOfSync during propagation; ignore noise.
  ignoreDifferences:
    - group: networking.istio.io
      kind: EnvoyFilter
      jsonPointers:
        - /spec/configPatches
