[project]
name = "writeup-svc"
version = "0.1.0"
description = "Offensive Conditions writeup service"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "C4", "T20", "PT", "RET"]
ignore = ["E501", "B008", "S101", "S104", "N805"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]
"scripts/*" = ["T20"]
"migrations/*" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiokafka.*", "celery.*", "grpc.*", "grpc_reflection.*", "markdown_it.*", "bleach.*"]
ignore_missing_imports = true
