# Forum service Kubernetes manifests
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forum-svc
  namespace: offcon
  labels:
    app.kubernetes.io/name: forum-svc
    app.kubernetes.io/part-of: offcon

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forum-svc-config
  namespace: offcon
data:
  APP_ENV: "production"
  APP_NAME: "forum-svc"
  HTTP_PORT: "8005"
  HTTP_HOST: "0.0.0.0"
  HTTP_WORKERS: "2"
  HTTP_CORS_ORIGINS: '["https://app.offensiveconditions.org","https://offensiveconditions.org"]'
  GRPC_PORT: "9005"
  GRPC_ENABLE_REFLECTION: "false"
  DB_HOST: "pg-primary.data.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "offcon"
  DB_USER: "forum_svc"
  DB_SSLMODE: "require"
  REDIS_HOST: "redis-primary.data.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "4"
  REDIS_TLS: "true"
  AUTH_JWT_PUBLIC_KEY_PATH: "/etc/auth/jwt.pub"
  AUTH_JWT_ISSUER: "https://auth.offensiveconditions.org"
  AUTH_JWT_AUDIENCE: "offcon-api"
  KAFKA_BROKERS: '["kafka-0.kafka.data.svc.cluster.local:9093","kafka-1.kafka.data.svc.cluster.local:9093","kafka-2.kafka.data.svc.cluster.local:9093"]'
  KAFKA_TOPIC_FORUM_EVENTS: "forum.events"
  KAFKA_USE_TLS: "true"
  USER_SVC_ADDR: "user-svc.offcon.svc.cluster.local:9001"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

---
apiVersion: v1
kind: Service
metadata:
  name: forum-svc
  namespace: offcon
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: forum-svc
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8005
      targetPort: http
    - name: grpc
      port: 9005
      targetPort: grpc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forum-svc-server
  namespace: offcon
  labels:
    app.kubernetes.io/name: forum-svc
    app.kubernetes.io/component: server
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: forum-svc
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forum-svc
        app.kubernetes.io/component: server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8005"
    spec:
      serviceAccountName: forum-svc
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forum-svc
          image: harbor.offensiveconditions.org/services/forum-svc:v0.1.0
          envFrom:
            - configMapRef:
                name: forum-svc-config
            - secretRef:
                name: forum-svc-secrets
          ports:
            - name: http
              containerPort: 8005
            - name: grpc
              containerPort: 9005
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1Gi"
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: auth-jwt
              mountPath: /etc/auth
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: auth-jwt
          secret:
            secretName: auth-jwt-public-key
            items:
              - key: jwt.pub
                path: jwt.pub
      terminationGracePeriodSeconds: 30

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forum-svc-worker
  namespace: offcon
  labels:
    app.kubernetes.io/name: forum-svc
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: forum-svc
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forum-svc
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: forum-svc
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: harbor.offensiveconditions.org/services/forum-svc:v0.1.0
          command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
          envFrom:
            - configMapRef: { name: forum-svc-config }
            - secretRef: { name: forum-svc-secrets }
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forum-svc-beat
  namespace: offcon
  labels:
    app.kubernetes.io/name: forum-svc
    app.kubernetes.io/component: beat
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: forum-svc
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forum-svc
        app.kubernetes.io/component: beat
    spec:
      serviceAccountName: forum-svc
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: beat
          image: harbor.offensiveconditions.org/services/forum-svc:v0.1.0
          command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
          envFrom:
            - configMapRef: { name: forum-svc-config }
            - secretRef: { name: forum-svc-secrets }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
          volumeMounts:
            - name: beat-schedule
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: beat-schedule
          emptyDir: {}

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: forum-svc-server
  namespace: offcon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: forum-svc-server
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 75 }

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: forum-svc-server
  namespace: offcon
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: forum-svc
      app.kubernetes.io/component: server

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forum-svc
  namespace: offcon
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: forum-svc
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { name: ingress-system } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: api-gateway } }
      ports:
        - { protocol: TCP, port: 8005 }
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/part-of: offcon } }
      ports:
        - { protocol: TCP, port: 9005 }
    - from:
        - namespaceSelector: { matchLabels: { name: observability } }
          podSelector: { matchLabels: { app: prometheus } }
      ports:
        - { protocol: TCP, port: 8005 }
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector: { matchLabels: { name: data } }
          podSelector: { matchLabels: { app.kubernetes.io/name: postgres } }
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - namespaceSelector: { matchLabels: { name: data } }
          podSelector: { matchLabels: { app.kubernetes.io/name: redis } }
      ports:
        - { protocol: TCP, port: 6379 }
    - to:
        - namespaceSelector: { matchLabels: { name: data } }
          podSelector: { matchLabels: { app.kubernetes.io/name: kafka } }
      ports:
        - { protocol: TCP, port: 9093 }
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: user-svc } }
      ports:
        - { protocol: TCP, port: 9001 }
